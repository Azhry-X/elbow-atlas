- id: prtee
  title: PRTEE (Patient-Rated Tennis Elbow Evaluation)
  page: 4
  type: info
  review_status: approved
  evidence: M
  summary: Condition-specific questionnaire (5 pain items + 10 function items, 0–10 per item) evaluating elbow pain (0–50) and functional disability (0–50) for a total score of 0–100.
  steps:
  - 'Pain subscale (5 items, each 0–10): at rest, doing a task with repeated arm movement, carrying a plastic bag of groceries, when at its least, and when at its worst. Pain = sum of 5 pain items (0–50).'
  - 'Function subscale (10 items, each 0–10: 6 specific activities + 4 usual activities). Function = sum of 10 function items ÷ 2 (0–50).'
  - Total score = Pain + Function (0–100, higher score = worse pain and disability).
  positive: Total score change ≥ 9 (MIC) / ≥ 17 (SDC95) in tennis elbow (Sveinall 2025) or ≥ 8.9 (MDC95, Shafiee 2022).
  interpretation: 'Shafiee 2022 (SR): test-retest 0.96 (0.94–0.97); SEM 3.1 (1.8 to 4.4); MDC95 8.9 (5.3–12.5). Sveinall 2025 (tennis elbow): total (0–100) SDC95 17, MIC 9; pain subscale (0–50) SDC95 8, MIC 11; function subscale (0–50) SDC95 12, MIC 4.'
  metrics: 'ICC: 0.96 (0.94–0.97); SEM 3.1 (1.8 to 4.4) (Shafiee 2022) · MDC: MDC95 8.9 (5.3–12.5) (Shafiee 2022); Sveinall 2025 SDC95: Total 17, Pain 8, Function 12 · MCID: Sveinall 2025 MIC: Total 9, Pain 11, Function 4'
  calculator:
    kind: formula
    decimals: 1
    value_label: / 100 PRTEE Total Score (Pain 0–50 + Function 0–50)
    expr: (p1+p2+p3+p4+p5) + (f1+f2+f3+f4+f5+f6+f7+f8+f9+f10)/2
    inputs:
    - heading: Pain Subscale (5 items, 0–10 each; sum 0–50)
    - key: p1
      label: 1. Pain at rest
      type: select
      options: &id001
      - - '0'
        - 0 — No pain / no difficulty
      - - '1'
        - 1 — 1
      - - '2'
        - 2 — 2
      - - '3'
        - 3 — 3
      - - '4'
        - 4 — 4
      - - '5'
        - 5 — 5
      - - '6'
        - 6 — 6
      - - '7'
        - 7 — 7
      - - '8'
        - 8 — 8
      - - '9'
        - 9 — 9
      - - '10'
        - 10 — Worst pain / unable to do
    - key: p2
      label: 2. Pain when doing a task with repeated arm movement
      type: select
      options: *id001
    - key: p3
      label: 3. Pain when carrying a plastic bag of groceries
      type: select
      options: *id001
    - key: p4
      label: 4. Pain when it is at its least
      type: select
      options: *id001
    - key: p5
      label: 5. Pain when it is at its worst
      type: select
      options: *id001
    - heading: Function Subscale — Specific & Usual Activities (10 items, 0–10 each; sum ÷ 2 = 0–50)
    - key: f1
      label: 6. Turn a doorknob or key
      type: select
      options: *id001
    - key: f2
      label: 7. Carry a grocery bag or briefcase by the handle
      type: select
      options: *id001
    - key: f3
      label: 8. Lift a full coffee cup or glass of milk to your mouth
      type: select
      options: *id001
    - key: f4
      label: 9. Open a jar
      type: select
      options: *id001
    - key: f5
      label: 10. Pull up pants
      type: select
      options: *id001
    - key: f6
      label: 11. Wring out a washcloth or wet towel
      type: select
      options: *id001
    - key: f7
      label: 12. Personal activities (dressing, washing)
      type: select
      options: *id001
    - key: f8
      label: 13. Household work (cleaning, maintenance)
      type: select
      options: *id001
    - key: f9
      label: 14. Work (your job or everyday main work)
      type: select
      options: *id001
    - key: f10
      label: 15. Recreational or sporting activities
      type: select
      options: *id001
    outputs:
    - when: v >= 0
      text: 'Pain Subscale: {p1+p2+p3+p4+p5|1} / 50 (SDC95 = 8, MIC = 11) · Function Subscale: {(f1+f2+f3+f4+f5+f6+f7+f8+f9+f10)/2|1} / 50 (SDC95 = 12, MIC = 4) · Total Score: {v|1} / 100 (Sveinall 2025 SDC95 = 17, MIC = 9; Shafiee 2022 MDC95 = 8.9)'
      tone: good
  sources:
  - text: Shafiee 2022 Disabil Rehabil
    url: https://doi.org/10.1080/09638288.2021.1938248
  - text: Sveinall 2025 Shoulder Elbow
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12122481/
    free_full_text: true
- id: oxford-elbow-score
  title: Oxford Elbow Score (OES)
  page: 4
  type: info
  review_status: approved
  evidence: M
  summary: 12-item patient-reported outcome measure (each 0–4) with three 4-item domains (Function, Pain, Social-Psychological), converted to 0–100 where higher is better.
  steps:
  - Score 12 items from 0 to 4 across three domains (Function, Pain, Social-Psychological), 4 items each.
  - Domain score = domain sum ÷ 16 × 100 (0–100, higher = better).
  - Compare change against Dawson 2008 post-surgical MCIDs and Wänström 2024 elbow-injury SDC.
  positive: Change ≥ 10 for Function, ≥ 18 for Pain and Social-Psychological after surgery (Dawson 2008); SDC 12.1 in elbow injury (Wänström 2024).
  interpretation: 'Dawson 2008 (after surgery): MCID ≈ 10 for Function (similar to DASH), ≈ 18 for Pain and Social-Psychological. Wänström 2024 (elbow injury): SDC OES 12.1 (QuickDASH 11.4, SANE 1.94).'
