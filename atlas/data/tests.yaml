- id: elbow-stiffness-arthrolysis-splinting
  title: 'Post-Traumatic Elbow Stiffness: Arthrolysis & Static Progressive vs Dynamic Splinting'
  page: 5
  type: info
  review_status: approved
  evidence: H
  summary: Evidence on open vs arthroscopic elbow arthrolysis and static progressive vs dynamic splinting for post-traumatic elbow contracture.
  steps:
  - 'Arthrolysis SR (Kodde 2013, 30 studies, 798 pts): ROM gain 51°, 40°, 88°, 56° and complications 23, 5, 73, 58% for open, arthroscopic, open + external fixator, open + distraction arthroplasty.'
  - 'Arthrolysis SR (Lanzerath 2023, 27 studies, 1666 pts): success (MEPS excellent/good): open 88.8% (revision 6.3%, other complications 18.1%); arthroscopic 91.8% (revision 1.6%, complications 9.1%).'
  - 'Splinting RCT (Lindenhovius 2012, n = 66): no difference between static progressive and dynamic splinting; stiffness "can improve with exercises and dynamic or static splinting over a period of six to twelve months, and patience is warranted".'
  positive: Exercises plus static progressive or dynamic splinting improve motion over 6–12 months; arthroscopic arthrolysis has lower complication rates than open procedures.
  interpretation: Post-traumatic stiffness "can improve with exercises and dynamic or static splinting over a period of six to twelve months, and patience is warranted" (Lindenhovius 2012); arthrolysis gains and complication rates differ by technique (Kodde 2013, Lanzerath 2023).
  metrics: Open vs arthroscopic MEPS excellent/good 88.8% vs 91.8% (Lanzerath 2023); splinting improves over 6–12 mo (Lindenhovius 2012)
  sources:
  - text: Kodde 2013 J Shoulder Elbow Surg
    url: https://doi.org/10.1016/j.jse.2012.11.010
  - text: Lanzerath 2023 Arch Orthop Trauma Surg
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10110632/
    free_full_text: true
  - text: Lindenhovius 2012 J Bone Joint Surg Am
    url: https://doi.org/10.2106/JBJS.J.01761
