  summary: Supine axial-valgus-supination manoeuvre testing for posterolateral rotatory instability (PLRI) of the elbow.
  steps:
  - Place the patient supine with the affected arm overhead and the shoulder externally rotated.
  - With the forearm fully supinated, apply axial compression and valgus stress while flexing the elbow from full extension.
  - Observe for posterolateral subluxation/dimpling of the radial head or patient apprehension, followed by a palpable clunk on reduction.
  positive: Apprehension in the awake patient or visible/palpable subluxation and reduction clunk of the radial head.
