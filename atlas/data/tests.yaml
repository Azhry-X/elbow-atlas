- id: eswt-laser-elbow
  title: ESWT, Low-Level Laser (904 nm) & Electrophysical Agents in LET
  page: 6
  type: info
  review_status: approved
  evidence: M
  summary: Evidence and JOSPT LET CPG recommendations for shockwave therapy, 904 nm low-level laser, ultrasound, phonophoresis, iontophoresis, and cryotherapy + TENS.
  steps:
  - 'ESWT (Buchbinder 2005 Cochrane): one trial (93 participants): steroid injection may be more effective than ESWT.'
  - 'Low-level laser (Bjordal 2008 MA): vs control: pain WMD 10.2 mm (3.0 to 17.5) on 100 mm VAS; 904 nm directly on the tendon (5 trials): 17.2 mm (8.5 to 25.9) more than placebo; pain-free grip SMD 0.66 (0.42 to 0.90).'
  - 'JOSPT LET CPG (Lucado 2022) — electrophysical agents: ultrasound: "a recommendation cannot be made for the use of ultrasound as a stand-alone treatment"; "Clinicians should not use phonophoresis with 10% hydrocortisone gel, topical prednisolone (2 mg/d), or 1% diclofenac sodium gel"; "may use iontophoresis with an anti-inflammatory drug, early in the rehabilitation phase (no later than 2–4 weeks from onset or aggravation of symptoms), in individuals presenting with highly irritable symptoms"; "may use laser therapy for improvements in pain and grip strength, seen in follow-up periods >4 weeks to 6 months"; "may use cryotherapy combined with burst transcutaneous electrical nerve stimulation (TENS) to reduce pain in the short term in individuals with symptoms of LET for greater than 30 days".'
  positive: 904 nm laser directly on the tendon improves pain (WMD 17.2 mm) and pain-free grip (SMD 0.66); phonophoresis is recommended against ("should not").
  interpretation: Select passive modalities only as targeted adjuncts according to symptom irritability and duration.
  metrics: 'Laser WMD 10.2 mm (904 nm: 17.2 mm), PFG SMD 0.66 (Bjordal 2008); ESWT 1 trial n = 93 (Buchbinder 2005)'
