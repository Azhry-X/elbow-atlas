  video_title: 'Physiotutors: Scratch Collapse Test | Cubital Tunnel Syndrome'
  summary: Cutaneous silent-period provocation test over the cubital tunnel assessing transient loss of resisted shoulder external rotation.
  steps:
  - Seat the patient with the elbows flexed at the sides and forearms neutral; resist bilateral shoulder external rotation to establish baseline symmetric strength.
