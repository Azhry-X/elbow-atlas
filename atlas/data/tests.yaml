- id: ucl-reconstruction-repair
  title: 'UCL Reconstruction & Internal Brace Repair: RTS & Rehabilitation'
  page: 5
  type: info
  review_status: approved
  evidence: M
  summary: Return-to-sport rates, surgical technique comparisons, internal brace repair outcomes, and rehabilitation components after UCL surgery.
  steps:
  - POST-OP RESTRICTIONS ARE SURGEON-DIRECTED.
  - 'UCL reconstruction SR (Erickson 2015 OJSM, 20 studies, 2019 athletes): pooled return to sport 86.2%; 90% excellent/good (Conway-Jobe); RTS collegiate 95.5% vs high school 89.4% vs professional 86.4%; docking 97.0%, ASMI 93.3%, Jobe 66.7%.'
  - 'Large series (Cain 2010, 743 athletes ≥ 2 y): 83% returned to the same or higher level in less than 1 year.'
  - 'UCL repair with internal brace (Dugas 2019, 111 throwers): 92% (102/111) returned to the same or higher level at a mean 6.7 months; mean KJOC 88.2.'
  - 'Rehab & RTS criteria SR (Kemler 2022, 33 studies, 3480 athletes): RTS timelines 6.5 to 16 months; protocols most often used bracing with progressive ROM (93.9%), strengthening (84.8%) and an interval throwing programme (81.8%); no study fully defined RTS criteria.'
