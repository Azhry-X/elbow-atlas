- id: elbow-extension-test
  title: Elbow Extension Test & Post-Trauma ROM Radiography Rules
  page: 1
  type: test
  review_status: approved
  evidence: H
  video_url: https://www.youtube.com/watch?v=1TILxnuB4P0
  video_title: 'Physiotutors: Elbow Extension Test | Olecranon Fracture'
  summary: Clinical decision rule assessing active elbow extension after acute trauma to screen for fracture and determine whether radiography can be safely deferred.
  steps:
  - Seat or stand the patient with the injured arm exposed and supinated.
  - Ask the patient to actively extend both elbows fully and compare symmetry with the uninjured side.
  - Also check active flexion, pronation, and supination and palpate the olecranon directly.
  - 'Decision rule in words: if the patient achieves full active extension and an olecranon fracture is not suspected, radiography can be deferred with safety-net advice; if active extension is incomplete, refer for radiograph.'
  positive: Inability to fully extend the elbow actively after acute injury (or limited active flexion, extension, pronation, or supination).
  interpretation: 'Appelboam 2008 (adults + children, n = 1740): Sn 96.8% (95.0–98.2), Sp 48.5% (45.6–51.4); worst-case Sn 95.3%; Sp similar in adults (47.7%) and children (49.5%). In adults, full extension gives NPV 98.4% (96.3–99.5), LR− 0.03 (0.01–0.08); radiography can be deferred if an olecranon fracture is not suspected, and patients not X-rayed "should return if symptoms have not resolved within 7-10 days". Lennon 2007: for detecting a normal radiograph, full extension Sp 0.916 (0.863–0.969), Sn 0.478; equal ROM Sp 0.976 (0.940–0.991), Sn 0.211; under 16 years equal ROM Sp 1 (0.941–1.000). Darracq 2008 (n = 113): limited active ROM (flexion, extension, pronation, supination) Sn 100% (0.93–1.00) for fracture or effusion; preserved active ROM Sp 97% (0.89–1.00) for absence of fracture.'
  metrics: 'SN: 96.8% (95.0–98.2) Appelboam; 100% (0.93–1.00) Darracq limited AROM · SP: 48.5% (45.6–51.4) Appelboam; normal radiograph Sp 0.916 full ext / 0.976 equal ROM (Lennon); 97% (0.89–1.00) Darracq · NPV: 98.4% (96.3–99.5) in adults · LR_NEG: 0.03 (0.01–0.08) in adults'
  sources:
  - text: Appelboam 2008 BMJ
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2600962/
    free_full_text: true
  - text: Lennon 2007 Emerg Med J
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2658213/
    free_full_text: true
  - text: Darracq 2008 Am J Emerg Med
    url: https://doi.org/10.1016/j.ajem.2007.11.005
- id: hook-test
  title: Hook Test (Distal Biceps Avulsion)
  page: 1
  type: test
  review_status: approved
  evidence: M
  video_url: https://www.youtube.com/watch?v=YsqdHsuLgC4
  video_title: 'Physiotutors: Hook Test | Distal Biceps Tendon Rupture'
  summary: Direct digital palpation test for complete distal biceps tendon avulsion in the antecubital fossa.
  steps:
  - Ask the patient to actively flex the elbow to 90° and fully supinate the forearm.
  - Bring your index finger from the lateral side of the antecubital fossa beneath the lateral edge of the biceps tendon.
  - Attempt to hook the cord-like distal biceps tendon anteriorly and compare with the contralateral elbow.
  positive: Absence of a palpable cord-like tendon under which the examiner's finger can hook (abnormal hook test) or pain/instability with partial tearing.
  interpretation: 'O''Driscoll 2007 (n = 45, surgery reference): Sn and Sp both 100%, outperforming MRI (Sn 92%, Sp 85%) in the same cohort.'
  metrics: 'SN: 100% (hook test) vs 92% (MRI) · SP: 100% (hook test) vs 85% (MRI) · n = 45, surgical reference standard'
  sources:
  - text: O'Driscoll 2007 Am J Sports Med
    url: https://doi.org/10.1177/0363546507305016
- id: biceps-squeeze-test
  title: Biceps Squeeze Test (Distal Biceps Rupture)
  page: 1
  type: test
  review_status: approved
  evidence: L
  video_url: https://www.youtube.com/watch?v=EGKj3rB2Jn8
  video_title: 'Physiotutors: Biceps Squeeze Test | Distal Biceps Tendon Rupture'
  summary: Compression test of the distal biceps muscle belly assessing mechanical continuity of the distal biceps insertion.
  steps:
  - Seat the patient with the forearm resting comfortably in slight pronation across the lap and the elbow flexed.
  - Place both hands around the distal myotendinous junction and muscle belly of the biceps brachii.
  - Firmly squeeze the biceps belly and observe for reflex forearm supination.
  positive: Failure of the forearm to supinate when the biceps belly is squeezed.
  interpretation: 'Ruland 2005: positive in 24 of 25 patients; complete rupture confirmed at surgery in 21 of 22.'
  metrics: Positive in 24 of 25 patients; complete rupture confirmed at surgery in 21 of 22 (Ruland 2005)
  sources:
  - text: Ruland 2005 Clin Orthop Relat Res
    url: https://doi.org/10.1097/01.blo.0000167668.18444.f5
- id: elbow-red-flags-triage
  title: Elbow Emergency Red Flags & Systemic / Proximal Referral Screen
  page: 1
  type: info
  review_status: approved
  evidence: E
  summary: Clinical red flags requiring emergency medical or orthopaedic referral and proximal referral sources mimicking elbow pathology.
  steps:
  - 'Dislocation with neurovascular compromise: gross deformity after trauma with absent/diminished radial or ulnar pulse, pallor, or acute median/ulnar/radial nerve deficit → emergency reduction and vascular assessment.'
  - 'Forearm compartment syndrome: severe pain out of proportion to injury, tense swollen forearm compartments, pain on passive finger extension, paraesthesia, or paresis → emergency surgical decompression.'
  - 'Septic olecranon bursitis or septic arthritis: acute hot, red, swollen olecranon bursa or elbow joint with fever, systemic malaise, or overlying skin breach → urgent aspiration/medical referral.'
  - 'Fracture in a child: acute trauma with refusal to use the arm, swelling, or incomplete active ROM → paediatric radiographic assessment.'
  - 'Cardiac referral to the left medial arm: non-mechanical medial arm/elbow ache associated with exertional chest tightness, dyspnoea, or jaw pain → emergency cardiac workup.'
  - 'Cervical radiculopathy referral: lateral or medial elbow pain reproduced by neck movement or accompanied by proximal arm paraesthesia/myotomal weakness → cervical spine and neurodynamic screen.'
  positive: Any red flag present mandates immediate or urgent medical/orthopaedic referral prior to mechanical rehabilitation.
  interpretation: Expert consensus triage gate ensuring limb-threatening, infectious, paediatric fracture, visceral cardiac, and cervical radicular presentations are identified at intake.
  metrics: Emergency / urgent referral screen (E)
  sources: []
- id: let-epidemiology-prognosis
  title: Epicondylitis Prevalence, Risk Factors & Natural Course vs Treatment
  page: 2
  type: info
  review_status: approved
  evidence: H
  summary: Population prevalence, occupational and smoking risk factors, and 52-week RCT trajectories comparing wait-and-see, physiotherapy, and corticosteroid injection.
  steps:
  - 'Prevalence (Shiri 2006, age 30–64, n = 4,783): definite lateral epicondylitis 1.3%, medial 0.4%; highest at 45–54 years; no sex difference.'
  - 'Risk factors for lateral epicondylitis (Shiri 2006): current smoking OR 3.4 (1.4–8.3); former smoking OR 3.0 (1.3–6.6); repetitive + forceful arm activity OR 5.6 (1.9–16.5).'
  - 'Natural course vs treatment (Smidt 2002 Lancet RCT, n = 185): success at 6 weeks: injection 92%, physiotherapy 47%, wait-and-see 32%; at 52 weeks: injection 69%, physiotherapy 91%, wait-and-see 83%.'
  - 'MWM + exercise vs injection vs wait-and-see (Bisset 2006 BMJ RCT, n = 198): at 52 weeks injection worse than physiotherapy (0.3, 0.1 to 0.5; NNT 4) and than wait-and-see on 2 of 3 measures (0.3, 0.04 to 0.4; NNT 4); after injection 47/65 (72%) deteriorated after 3 or 6 weeks.'
  positive: High 52-week recovery with wait-and-see (83%) and physiotherapy (91%), whereas corticosteroid injection shows high recurrence (72%).
  interpretation: Counselling patients on the favourable 52-week natural course and high post-injection recurrence rate is central to shared decision-making.
  metrics: Prevalence LET 1.3%, medial 0.4%; repetitive + forceful OR 5.6 (1.9–16.5); 52-wk success physio 91%, wait-and-see 83%, injection 69% (NNT 4)
  sources:
  - text: Shiri 2006 Am J Epidemiol
    url: https://doi.org/10.1093/aje/kwj325
  - text: Smidt 2002 Lancet
    url: https://doi.org/10.1016/S0140-6736(02)07811-X
  - text: Bisset 2006 BMJ
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1633771/
    free_full_text: true
- id: elbow-differential-pathologies
  title: Elbow Differential Diagnosis Guide (Medial Epicondylalgia, Radial Tunnel / PIN, OCD Capitellum, OA / Stiffness)
  page: 2
  type: info
  review_status: approved
  evidence: E
  summary: Clinical differentiation of medial flexor-pronator tendinopathy, radial tunnel / posterior interosseous nerve entrapment, capitellar osteochondritis dissecans, and elbow osteoarthritis / post-traumatic stiffness.
  steps:
  - 'Medial epicondylalgia (golfer''s elbow): insidious medial epicondyle pain aggravated by resisted wrist flexion and forearm pronation; tender over the common flexor-pronator origin just distal/anterior to the medial epicondyle; differentiate from UCL insufficiency and cubital tunnel syndrome.'
  - 'Radial tunnel / posterior interosseous nerve (PIN) syndrome: deep aching pain over the mobile wad / supinator mass distal to the lateral epicondyle (radial tunnel) or pure motor weakness of finger/thumb extension without sensory loss (PIN).'
  - 'Osteochondritis dissecans (OCD) of the capitellum: lateral elbow pain, catching, locking, or effusion in adolescent overhead throwers or gymnasts exacerbated by valgus compression.'
  - 'Osteoarthritis / post-traumatic stiffness: global or capsular loss of flexion-extension and/or forearm rotation, end-range impingement pain, or crepitus after trauma or degenerative joint disease.'
  positive: Pattern recognition guides targeted special testing and imaging referral when mechanical locking or motor denervation is present.
  interpretation: Expert clinical differentiation across lateral, medial, anterior, and posterior elbow compartments.
  metrics: Clinical differential signposts (E)
  sources: []
- id: elbow-active-rom
  title: Elbow Active Range of Motion (AROM)
  page: 3
  type: test
  review_status: approved
  evidence: M
  video_url: https://www.youtube.com/watch?v=PNWRcx6ZYKg
  video_title: 'Physiotutors: Active Range of Motion: Elbow'
  summary: Active range-of-motion assessment of elbow flexion, extension, forearm pronation, and supination.
  steps:
  - Ask the patient to actively flex and extend the elbow through full available range while observing end-range symmetry and symptom provocation.
  - With the elbow tucked at the side at 90° flexion, ask the patient to actively pronate and supinate the forearm and compare with the uninvolved side.
