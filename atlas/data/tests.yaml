  review_status: approved
  evidence: M
  video_url: https://www.youtube.com/watch?v=ASRatLbu8i0
  video_title: 'Physiotutors: Tinel Sign Elbow | Cubital Tunnel Syndrome'
  summary: Percussion test over the ulnar nerve in the retrocondylar groove / cubital tunnel.
  steps:
  - Support the patient's arm in slight elbow flexion and locate the ulnar nerve in the groove between the medial epicondyle and olecranon.
