- id: radial-head-fracture-rehab
  title: 'Radial Head & Mason I–II Elbow Fractures: Early Mobilisation & Non-Operative Trials'
  page: 5
  type: info
  review_status: approved
  evidence: M
  summary: Randomised trials and Cochrane evidence on early mobilisation and non-operative management of Mason I–II radial head fractures.
  steps:
  - 'Liow 2002 (RCT, n = 60): immediate mobilisation gave less pain and better function at 1 week, with no harm.'
  - 'Paschos 2013 (RCT, n = 180): early mobilisation is safe and effective; a delay of 48 hours before early mobilisation "could be advantageous".'
  - 'Harding 2011 (Cochrane): no difference between early and delayed mobilisation in pain or ROM limitation (Mason I–II); all participants returned to full ADL, none changed occupation.'
  - 'Mulders 2021 (RCT, Mason II): operative vs non-operative management showed similar function at 1 year.'
  positive: Early active mobilisation (immediate or after 48 hours) is safe and effective in stable Mason I–II radial head fractures.
  interpretation: Early mobilisation of minimally displaced / Mason I–II radial head fractures was safe in RCTs (Liow 2002, Paschos 2013); Cochrane found no difference between early and delayed mobilisation in pain or ROM limitation (Harding 2011).
  metrics: Immediate/48-h early mobilisation safe & effective (Liow 2002, Paschos 2013, Harding 2011); Mason II op vs non-op similar at 1 y (Mulders 2021)
