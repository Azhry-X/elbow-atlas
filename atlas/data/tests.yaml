- id: elbow-passive-rom
  title: Elbow Passive Range of Motion (PROM) & End-Feel
  page: 3
  type: test
  review_status: approved
  evidence: E
  video_url: https://www.youtube.com/watch?v=309Q8IJDq7s
  video_title: 'Physiotutors: Elbow Passive Range of Motion (PROM)'
  summary: Passive range-of-motion and end-feel assessment of the ulnohumeral, radiocapitellar, and proximal radioulnar joints.
  steps:
  - Stabilise the distal humerus and passively move the elbow into full flexion (soft tissue approximation) and extension (bony olecranon-fossa contact).
  - With the elbow flexed to 90°, passively pronate and supinate the radius on the ulna to assess capsular/tissue stretch end-feel.
  - Note any capsular stiffness, bony block, springy loose-body block, or pain before tissue resistance.
  positive: Loss of passive motion, abnormal bony/springy end-feel, or concordant pain reproduction.
  interpretation: Differentiates true capsular/intra-articular restriction (OA, arthrofibrosis, OCD loose body) from contractile pain inhibition.
  metrics: Compare bilaterally alongside goniometric real-change values (E)
  sources: []
- id: elbow-goniometry
  title: Elbow & Forearm Universal Goniometry (Real-Change Thresholds)
  page: 3
  type: info
  review_status: approved
  evidence: M
  summary: Universal goniometer intra-rater and inter-rater real-change thresholds for elbow flexion, extension, pronation, and supination.
  steps:
  - Align the universal goniometer over the lateral epicondyle (humeral shaft stationary arm, radial shaft moving arm) for flexion and extension.
  - Measure forearm pronation and supination with the elbow stabilised at 90° against the trunk.
  - Apply Armstrong 1998 real-change thresholds to distinguish true clinical progress from measurement error.
  positive: Change exceeding the intra-rater or inter-rater threshold represents real change in joint motion.
  interpretation: 'Armstrong 1998 (universal goniometer): same tester real change if greater than 6° flexion, 7° extension, 8° pronation, 8° supination; between testers 10° flexion, 10° extension, 10° pronation, 11° supination.'
  metrics: 'Same tester real change: > 6° flex, 7° ext, 8° pron, 8° sup; between testers: 10° flex, 10° ext, 10° pron, 11° sup'
  sources:
  - text: Armstrong 1998 J Shoulder Elbow Surg
    url: https://doi.org/10.1016/s1058-2746(98)90003-9
- id: pain-free-grip-strength
  title: Pain-Free & Maximum Grip Strength (Dynamometry & Ratio Calculator)
  page: 3
  type: test
  review_status: approved
  evidence: M
  summary: Core physical impairment measure for lateral epicondylalgia assessing pain-free grip force, maximum grip force, and limb symmetry ratio.
  steps:
  - Position the patient with the elbow in standardized extension (or repeatable test posture) holding a calibrated hand-held dynamometer.
  - 'For pain-free grip (PFG): instruct the patient to squeeze slowly and stop at the very first onset of elbow pain; record in kg.'
  - 'For maximum grip: instruct the patient to squeeze maximally; record in kg and rate pain on gripping (0–10).'
  - Compute the affected ÷ unaffected × 100 (%) ratio and compare longitudinal change against the Sveinall 2025 SDC95 and MIC values.
  positive: Reduced pain-free grip on the affected side relative to the unaffected side; improvement ≥ 6.5 kg (MIC) / ≥ 6.4 kg (SDC95) indicates meaningful change.
  interpretation: 'Smidt 2002 Arch Phys Med Rehabil: interobserver ICC pain-free grip .97, maximum grip .98, severity of complaints .90, pressure pain threshold .77 (unsatisfactory). Sveinall 2025: SDC95 6.4 kg pain-free grip, 8.4 kg maximum grip; MIC 6.5 kg pain-free, 1 kg maximum; pain on gripping SDC95 4, MIC 3.5 (0–10).'
  metrics: 'ICC: PFG .97, max grip .98, severity .90, PPT .77 (Smidt 2002) · MDC: SDC95: 6.4 kg PFG, 8.4 kg max grip, 4 pain on gripping (0–10) (Sveinall 2025) · MCID: MIC: 6.5 kg PFG, 1 kg max grip, 3.5 pain on gripping (0–10) (Sveinall 2025)'
  calculator:
    kind: formula
    decimals: 1
    value_label: '% Pain-Free Grip Ratio (Affected ÷ Unaffected × 100)'
    expr: '(affected > 0 && unaffected > 0) ? (affected / unaffected * 100) : NaN'
    inputs:
    - heading: Pain-Free Grip Strength (kg)
    - key: affected
      label: Affected arm pain-free grip (kg)
      type: number
    - key: unaffected
      label: Unaffected arm pain-free grip (kg)
      type: number
    outputs:
    - when: v >= 0
      text: 'Affected/Unaffected Ratio: {v|1}% · Sveinall 2025 change thresholds: Pain-free grip SDC95 = 6.4 kg, MIC = 6.5 kg · Maximum grip SDC95 = 8.4 kg, MIC = 1 kg · Pain on gripping (0–10) SDC95 = 4, MIC = 3.5'
      tone: good
  sources:
  - text: Smidt 2002 Arch Phys Med Rehabil
    url: https://doi.org/10.1053/apmr.2002.33728
  - text: Sveinall 2025 Shoulder Elbow
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12122481/
    free_full_text: true
  - text: Lucado 2022 JOSPT LET CPG
    url: https://doi.org/10.2519/jospt.2022.0302
- id: jospt-2022-let-cpg
  title: JOSPT 2022 Lateral Elbow Tendinopathy Clinical Practice Guideline
  page: 3
  type: info
  review_status: approved
  evidence: E
  summary: Academy of Hand and Upper Extremity Physical Therapy / APTA Clinical Practice Guideline for Lateral Elbow Tendinopathy (Lucado 2022).
  steps:
  - 'Impairment measures: "Clinicians should include the physical impairment measures of elbow and wrist range of motion, pressure pain threshold, pain-free grip strength, and maximum grip strength at baseline and at least one other follow-up point that includes discharge".'
  - 'Exercise: "Clinicians should use isometric, concentric, and/or eccentric therapeutic resisted exercises of the wrist extensors in the treatment of individuals with subacute or chronic LET" and "should use therapeutic resisted wrist extension strengthening exercises in combination with other therapeutic interventions, including manual therapy".'
  - 'Manual therapy & dry needling: "Clinicians should use local elbow joint manipulation or mobilization techniques to reduce pain and increase pain-free grip strength … for those who can tolerate the specific technique" and "Clinicians should use either tendon or trigger point dry needling for the treatment of pain and functional deficits associated with LET".'
  - 'Orthoses, taping & EPAs: "Clinicians should use rigid taping techniques for immediate/short-term pain relief and improvement in pain-free muscle function in those with irritable LET"; see Page 6 and Page 7 cards for full verbatim recommendations.'
  positive: Guideline strength is indicated by "should", "may", "should not", or "a recommendation cannot be made".
  interpretation: Provides the framework for baseline/discharge impairment testing and multimodal rehabilitation in LET.
  metrics: Clinical Practice Guideline (Lucado 2022 JOSPT)
  sources:
  - text: Lucado 2022 JOSPT LET CPG
    url: https://doi.org/10.2519/jospt.2022.0302
- id: c5-t1-neuro-screen-elbow
  title: C5–T1 Neurological Screen, Carrying Angle & Elbow Palpation Map
  page: 3
  type: test
  review_status: approved
  evidence: E
  summary: Regional anatomical palpation, carrying angle inspection, and C5–T1 myotomal, dermatomal, and deep tendon reflex screening.
  steps:
  - Inspect carrying angle in full extension/supination and check for joint effusion in the lateral soft spot (infracondylar recess between lateral epicondyle, radial head, and olecranon tip).
  - 'Palpate systematically: lateral epicondyle & ECRB tendon origin, radial head & annular ligament, radial tunnel / supinator belly, antecubital fossa & distal biceps tendon, medial epicondyle & common flexor-pronator origin, sublime tubercle & anterior bundle of UCL, olecranon tip/bursa, and cubital tunnel / ulnar nerve.'
  - Screen C5–T1 dermatomes, myotomes (C5 shoulder abduction, C6 elbow flexion/wrist extension, C7 elbow extension/wrist flexion, C8 thumb extension/finger flexion, T1 finger abduction), and reflexes (C5 biceps, C6 brachioradialis, C7 triceps).
  positive: Focal anatomical tenderness, joint effusion, or segment-specific dermatomal/myotomal/reflex deficit.
  interpretation: Clears cervical radicular and peripheral nerve involvement while localising the primary elbow pain generator.
  metrics: Systematic palpation & C5–T1 neurological examination (E)
  sources: []
- id: ultt2b-radial
  title: Upper Limb Tension Test 2b — Radial Nerve Bias (ULTT2b)
  page: 3
  type: test
  review_status: approved
  evidence: E
  video_url: https://www.youtube.com/watch?v=rir6x6Iiqc4
  video_title: 'Physiotutors: All Upper Limb Tension Tests | ULTT | ULNT'
  summary: Neurodynamic provocation test biasing the radial nerve and posterior interosseous nerve across the lateral elbow and radial tunnel.
  steps:
  - Position the patient supine; depress the shoulder girdle and extend the elbow.
  - Internally rotate the shoulder and pronate the forearm.
  - Flex the wrist and fingers (and ulnarly deviate the wrist), then gently abduct the shoulder.
  - Perform structural differentiation via contralateral cervical side-bending or releasing shoulder depression.
  positive: Reproduction of the patient's concordant lateral elbow or dorsal forearm pain that alters with structural differentiation, and side-to-side asymmetry.
  interpretation: Helps identify radial nerve / posterior interosseous nerve mechanosensitivity contributing to lateral elbow pain.
  metrics: Radial nerve / PIN neurodynamic screen (E)
  sources: []
