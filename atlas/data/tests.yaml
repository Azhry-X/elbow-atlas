- id: ucl-nonop-interval-throwing
  title: UCL Non-Operative Rehabilitation & Interval Throwing Programme
  page: 8
  type: info
  review_status: approved
  evidence: M
  summary: Evidence on non-operative UCL rehabilitation and structured interval throwing programmes after UCL injury or reconstruction.
  steps:
  - 'UCL non-operative rehab (Erickson 2015 Sports Health): "Nonoperative treatment should be attempted, but limited studies have not shown promising results".'
  - 'UCL rehab after reconstruction (Kemler 2022 SR, 33 studies, 3480 athletes): protocols most often used bracing with progressive ROM (93.9%), strengthening (84.8%) and an interval throwing programme (81.8%); RTS timelines 6.5 to 16 months; no study fully defined RTS criteria.'
  positive: Progression through flat-ground distance/volume phases to mound throwing only when pain-free with full ROM and strength.
  interpretation: Track throwing distance, effort, pitch count, and next-day medial elbow soreness alongside KJOC score.
  metrics: Interval throwing programme in 81.8% of protocols; bracing + ROM 93.9%, strengthening 84.8%; RTS 6.5 to 16 months (Kemler 2022)
  sources:
  - text: Erickson 2015 Sports Health
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4622381/
    free_full_text: true
  - text: Kemler 2022 Am J Sports Med
    url: https://doi.org/10.1177/03635465211033994
- id: elbow-tracking-flowsheet
  title: 12-Visit Elbow Rehabilitation Flowsheet & Discharge Milestones
  page: 9
  type: info
  review_status: approved
  evidence: M
  summary: Longitudinal 12-visit session tracker and population-specific discharge thresholds for PRTEE, Oxford Elbow Score, QuickDASH, KJOC, goniometry, and grip strength.
  steps:
  - 'PRTEE: Shafiee 2022 (SR): test-retest 0.96 (0.94–0.97), SEM 3.1 (1.8 to 4.4), MDC95 8.9 (5.3–12.5); Sveinall 2025 (tennis elbow): total (0–100) SDC95 17, MIC 9; pain subscale (0–50) SDC95 8, MIC 11; function subscale (0–50) SDC95 12, MIC 4.'
  - 'Oxford Elbow Score: Dawson 2008 (after surgery): MCID ≈ 10 for Function, ≈ 18 for Pain and Social-Psychological; Wänström 2024 (elbow injury): SDC 12.1.'
  - 'QuickDASH & SANE (Wänström 2024, elbow injury): SDC QuickDASH 11.4, SANE 1.94.'
  - 'Pain-free & maximum grip (Sveinall 2025, tennis elbow): SDC95 6.4 kg pain-free grip, 8.4 kg maximum grip; MIC 6.5 kg pain-free, 1 kg maximum; pain on gripping SDC95 4, MIC 3.5 (0–10).'
  - 'Goniometry (Armstrong 1998): same tester real change > 6° flexion, 7° extension, 8° pronation, 8° supination; between testers 10° flexion, 10° extension, 10° pronation, 11° supination.'
  positive: Attainment of MIC / SDC thresholds and functional return-to-work/sport goals.
  interpretation: Combines objective impairment changes (ROM, pain-free/maximum grip) with validated PROM milestones.
  metrics: PRTEE MIC 9 / SDC95 17 / MDC95 8.9; OES MCID ≈ 10 Fn / ≈ 18 Pain & Soc-Psych, SDC 12.1; QuickDASH SDC 11.4; PFG MIC 6.5 kg / SDC95 6.4 kg
