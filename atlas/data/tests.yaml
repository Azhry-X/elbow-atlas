  evidence: H
  summary: Evidence on neurological complications, single vs double incision, and early motion vs immobilisation after distal biceps tendon repair.
  steps:
  - POST-OP RESTRICTIONS ARE SURGEON-DIRECTED.
  - 'Complications (Amarasooriya 2020 SR): major complications 4.6%; minor 20.4% (n = 630); most common lateral (antebrachial) cutaneous nerve injury 9.2% (n = 283); LABCN injury higher with limited anterior vs extensile single incision (9.7% vs 5.2%, P = .03); superficial radial nerve injury higher with extensile vs limited incision (6% vs 2.1%, P = .002); fixation technique had no effect on rerupture or PIN injury.'
  - 'Single vs double incision (Amin 2016 MA): LABCN neurapraxia most common after single incision: 77 of 785 (9.8%).'
  - 'Early motion vs immobilisation (Bergman 2021 RCT, cortical button): no difference in return to work (p ≥ 0.83); "No clinically important group differences were seen".'
  positive: Monitor lateral antebrachial cutaneous nerve (LABCN), superficial radial nerve, and posterior interosseous nerve (PIN) function post-operatively.
  interpretation: In a cortical-button RCT, early motion vs immobilisation made no difference to return to work (p ≥ 0.83) and "No clinically important group differences were seen" (Bergman 2021). POST-OP RESTRICTIONS ARE SURGEON-DIRECTED.
