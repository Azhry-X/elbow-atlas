- id: mwm-elbow
  title: Mobilisation with Movement (MWM Lateral Glide) for Lateral Epicondylalgia
  page: 7
  type: info
  review_status: approved
  evidence: H
  summary: Mulligan lateral-glide mobilisation with movement combined with pain-free gripping and exercise in lateral epicondylalgia.
  steps:
  - Stabilise the distal humerus medially while applying a sustained pain-free lateral glide to the proximal ulna and radius just distal to the elbow joint line.
  - While maintaining the lateral glide, instruct the patient to perform a pain-free grip squeeze; adjust glide angle/force so the grip is completely pain-free, and repeat in sets.
  - 'Vicenzino 2001 (crossover RCT): specific, immediate hypoalgesia on the affected side.'
  - 'Coombes 2013 (JAMA RCT, n = 165): at 4 weeks, placebo injection + physiotherapy (MWM + exercise): recovered/much improved 39% vs 10% without physio (RR 4.00, 1.07–15.00); at 1 year physio vs no physio 91% vs 88% (RR 1.04, 0.90–1.19), recurrence 29% vs 38%.'
  positive: Immediate increase in pain-free grip force during the sustained lateral glide and accelerated 4-week recovery (RR 4.00).
  interpretation: Physiotherapy (MWM + exercise) improved 4-week recovery vs no physiotherapy (39% vs 10%) but not 1-year outcomes (91% vs 88%) (Coombes 2013); MWM gives immediate, specific hypoalgesia (Vicenzino 2001).
  metrics: '4-wk placebo + physio vs no physio: 39% vs 10% recovered/much improved, RR 4.00 (1.07–15.00); 1-y 91% vs 88%, RR 1.04 (0.90–1.19), recurrence 29% vs 38% (Coombes 2013)'
  sources:
  - text: Vicenzino 2001 Man Ther
    url: https://doi.org/10.1054/math.2001.0411
  - text: Coombes 2013 JAMA
    url: https://doi.org/10.1001/jama.2013.129
- id: elbow-joint-mobilisation-friction
  title: Elbow Joint Mobilisation, Deep Friction, IASTM & Dry Needling in LET
  page: 7
  type: info
  review_status: approved
  evidence: M
  summary: Systematic review and JOSPT LET CPG evidence on local/regional joint mobilisation, deep transverse friction, IASTM, and dry needling.
  steps:
  - 'Joint mobilisation SR/MA (Lucado 2019): "compelling evidence that joint mobilizations have a positive effect on both pain and/or functional grip scores across all time frames compared to control groups".'
  - 'Deep transverse friction (Loew 2014 Cochrane): uncertain whether it improves pain and function (very low-quality evidence).'
  - 'JOSPT LET CPG (Lucado 2022): "Clinicians should use local elbow joint manipulation or mobilization techniques to reduce pain and increase pain-free grip strength … for those who can tolerate the specific technique"; "may use manipulation or mobilization techniques directed at the cervical spine, thoracic spine, and/or wrist as an adjunct to local treatment for short-term pain relief … when impairments in those regions are identified"; "may use instrument-assisted soft tissue mobilization combined with exercise to improve pain and function in those with chronic LET"; deep transverse friction: "a recommendation cannot be made"; "Clinicians should use either tendon or trigger point dry needling for the treatment of pain and functional deficits associated with LET".'
  positive: Local elbow mobilisation/manipulation ("should") and tendon/trigger-point dry needling ("should") are recommended; deep transverse friction is not supported.
  interpretation: Combine local elbow joint mobilisation with progressive wrist extensor loading.
  metrics: Lucado 2019 SR + Loew 2014 Cochrane + Lucado 2022 JOSPT LET CPG
  sources:
  - text: Lucado 2019 J Hand Ther
    url: https://doi.org/10.1016/j.jht.2018.01.010
  - text: Loew 2014 Cochrane
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7154576/
    free_full_text: true
  - text: Lucado 2022 JOSPT LET CPG
    url: https://doi.org/10.2519/jospt.2022.0302
- id: cubital-tunnel-conservative-care
  title: 'Cubital Tunnel Syndrome: Conservative Management (Splinting, Education & Neural Gliding)'
  page: 7
  type: info
  review_status: approved
  evidence: E
  summary: Non-operative management of mild-to-moderate cubital tunnel syndrome focusing on flexion avoidance, night splinting, ergonomic modification, and ulnar nerve gliding.
  steps:
  - 'Patient education and ergonomic modification: avoid prolonged elbow flexion (phone use, sleeping with flexed elbows) and direct pressure on the medial epicondyle / retrocondylar groove.'
  - 'Night splinting / towel wrap: maintain the elbow in comfortable extension at night to prevent sustained intraneural traction and compression.'
  - Gentle ulnar nerve sliders/gliding exercises performed without provoking distal paraesthesia or numbness.
