- id: elbow-orthoses-taping
  title: Counterforce / Wrist Orthoses, Rigid Taping & Kinesiology Tape in LET
  page: 6
  type: info
  review_status: approved
  evidence: L
  summary: Cochrane review and JOSPT LET CPG recommendations on forearm counterforce / wrist orthoses, rigid diamond/deloading taping, and kinesiology tape.
  steps:
  - 'Orthoses / counterforce brace (Struijs 2002 Cochrane): "No definitive conclusions can be drawn concerning effectiveness of orthotic devices".'
  - 'JOSPT LET CPG (Lucado 2022): "Clinicians may use a forearm counterforce or wrist support orthosis to be worn during activity for immediate improvement of pain and strength in those with LET whose symptoms are aggravated with activity"; for intermediate or long-term symptoms: "a recommendation cannot be made".'
  - 'Rigid taping (Lucado 2022): "Clinicians should use rigid taping techniques for immediate/short-term pain relief and improvement in pain-free muscle function in those with irritable LET".'
  - 'Kinesiology tape (Lucado 2022): "Clinicians may use kinesiology tape application as part of a multimodal treatment program for immediate and short-term management of pain and muscle function".'
  positive: Rigid taping ("should") and activity orthoses / kinesiology tape ("may") provide immediate/short-term symptom modulation in irritable LET.
  interpretation: Use taping or counterforce bracing to enable pain-free loading and daily activity in irritable presentations.
