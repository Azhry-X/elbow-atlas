- id: corticosteroid-injection-let
  title: Corticosteroid Injection in Lateral Epicondylalgia (Bisset 2006, Coombes 2010 & 2013)
  page: 6
  type: info
  review_status: approved
  evidence: H
  summary: Short-term analgesia vs intermediate/long-term harm and recurrence after corticosteroid injection for lateral epicondylalgia.
  steps:
  - 'Bisset 2006 (BMJ RCT, n = 198): better at 6 weeks, but "paradoxically reversed after six weeks, with high recurrence rates"; worse than physiotherapy at 52 weeks (NNT 4); 47/65 (72%) deteriorated after 3 or 6 weeks.'
  - 'Coombes 2010 (Lancet SR, 41 RCTs): lateral epicondylalgia: large short-term pain effect vs no intervention (SMD 1·44, 1·17–1·71) but no intervention favoured at intermediate term (−0·40, −0·67 to −0·14) and long term (−0·31, −0·61 to −0·01); serious adverse event (tendon rupture) in 1 of 991 (0·1%).'
  - 'Coombes 2013 (JAMA RCT, n = 165, corticosteroid vs placebo injection ± physio): 1 year: recovery 83% vs 96% (RR 0.86, 99% CI 0.75–0.99); recurrence 54% vs 12% (RR 0.23, 0.10–0.51); 26 weeks: 55% vs 85% (RR 0.79, 0.62–0.99).'
  positive: Corticosteroid injection increases 1-year recurrence (54% vs 12%) and lowers 1-year recovery (83% vs 96%) compared with placebo.
  interpretation: 'Short-term benefit reverses: outcomes at 26–52 weeks are worse than placebo, physiotherapy or wait-and-see, with high recurrence (Bisset 2006; Coombes 2010; Coombes 2013).'
  metrics: Short-term SMD 1·44 (1·17–1·71), intermediate −0·40, long-term −0·31 (Coombes 2010); 1-y recurrence 54% vs 12% (Coombes 2013); 72% deteriorated (Bisset 2006)
  sources:
  - text: Bisset 2006 BMJ
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1633771/
    free_full_text: true
  - text: Coombes 2010 Lancet
    url: https://doi.org/10.1016/S0140-6736(10)61160-9
  - text: Coombes 2013 JAMA
    url: https://doi.org/10.1001/jama.2013.129
- id: prp-autologous-blood-let
  title: PRP & Autologous Blood Injections for Lateral Epicondylalgia (Karjalainen 2021, Kim 2021)
  page: 6
  type: info
  review_status: approved
  evidence: H
  summary: Cochrane review and meta-analysis evidence comparing platelet-rich plasma (PRP) and autologous blood (AB) injections against placebo/control.
  steps:
  - 'Karjalainen 2021 (Cochrane, 8 studies): vs placebo at 3 months: pain 0.16 points better (0–10), function 2 points (0–100) — not clinically important.'
