  summary: Manual posterolateral translation test of the proximal radius and ulna on the humerus for LUCL insufficiency.
  steps:
  - Position the patient supine with the arm overhead and the elbow flexed.
  - Stabilise the distal humerus with one hand and grasp the proximal forearm with the other.
